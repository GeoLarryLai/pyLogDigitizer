<html lang="en"><head><meta charset="utf-8"><title>pyLogDigitizer</title>
<link rel="stylesheet" href="/shell/static/shell.css"><link rel="stylesheet" href="/static/app.css">
<script src="/core/static/vendor/openseadragon/openseadragon.min.js"></script></head>
<body>
<header id="top"><span class="brand" title="pyLogDigitizer"><img src="/static/logo.png" alt="pyLogDigitizer" width="40" height="47"></span><span class="doc" id="doc">no scan loaded</span>
  <button id="undoBtn" title="Undo the last change (Z)" disabled>↶ Undo</button>
  <button id="quitBtn" class="ghost" title="Stop the app">Quit</button></header>
<nav id="rail"></nav>
<main id="main"><div id="viewer"></div><canvas id="ov"></canvas>
  <div id="layers" hidden><b>Layers</b><label><input type="checkbox" id="lyScan" checked> scan</label><label><input type="checkbox" id="lyHl"> selected curve ink</label><label><input type="checkbox" id="lyGrid" checked> tracks and grid</label><label><input type="checkbox" id="lyTr" checked> traced curves</label></div>
  <div id="curvePanel" hidden></div>
  <div id="scalePops"></div><div id="tabBadge"></div><div id="lyState" hidden></div>
  <div id="logPane" hidden><canvas id="logCv"></canvas></div>
  <div id="fig" hidden></div>
  <div id="empty"><div><h1><img class="home-logo" src="/static/logo.png" alt="pyLogDigitizer" width="130" height="151"></h1><p>Turns a scanned paper well log into a LAS file, on your own computer.<br>Start with <b>1 · Open scan</b> on the right.</p></div></div>
</main>
<aside id="side"><div class="head"><h2 id="stepTitle"></h2><p class="lead" id="stepLead"></p>
  <button class="main" id="mainBtn"></button><div class="note" id="dirty"></div></div>
  <div class="body" id="stepBody"></div></aside>
<footer id="bar"><span class="help" id="help"></span><span id="progtxt"></span><span class="prog" id="prog"><i></i></span></footer>
<footer class="app-credits" aria-label="Project credits and license"><span>Project by Larry Syu-Heng Lai, PhD.</span><span>AGPL-3.0 or later license</span></footer>
<div id="toast"></div>
<script src="/shell/static/shell.js"></script><script src="/static/app.js"></script>
</body></html>
