<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en"><head><meta charset="utf-8"><title>pyLogDigitizer editor</title>
<link rel="stylesheet" href="/static/editor.css">
<script src="/static/vendor/openseadragon/openseadragon.min.js"></script>
</head><body>
<aside id="side">
  <h1>pyLogDigitizer <small>local editor</small></h1>
  <section><h2>1. Scan</h2>
    <select id="catalog"></select>
    <label><input type="checkbox" id="autoLayout" checked> auto layout + OCR</label>
    <button id="openBtn">Open</button>
    <div id="openInfo" class="info"></div>
  </section>
  <section><h2>2. Section</h2>
    <select id="trackSel"></select> <button id="useTrack">Use track</button><br>
    <button class="mode" data-mode="box">Draw box (2 clicks)</button>
    <div class="row">depth <input id="secTop" size="6"> – <input id="secBase" size="6"> ft <button id="applyRange">Apply</button></div>
  </section>
  <section><h2>3. Depth calibration</h2>
    <div id="depthInfo" class="info"></div>
    <div class="row">first label <input id="firstDepth" size="6"> step <input id="labelStep" size="4"> <button id="applyLabels">Re-run</button></div>
    <button class="mode" data-mode="depth">Click depth labels</button>
    <div id="depthPending" class="info"></div><button id="applyDepth">Apply clicked depths</button>
  </section>
  <section><h2>4. Scale</h2>
    <div class="row">left <input id="scL" size="5"> right <input id="scR" size="5">
      <select id="scT"><option>linear</option><option>log</option></select></div>
    <div class="row">backup <input id="bkL" size="5"> <input id="bkR" size="5"> wraps
      <select id="wrapSide"><option>right</option><option>left</option></select>
      <label><input type="checkbox" id="hatch"> hatch</label></div>
    <button id="applyScale">Apply scale</button>
    <div class="row"><button id="proposeHeader">Proposed header (OCR)</button></div>
    <div id="headerInfo" class="info"></div>
    <table id="headerTbl" class="props"></table>
  </section>
  <section><h2>5. Trace</h2>
    <button class="mode" data-mode="seed">Click curve to seed</button>
    <button id="autoTrace">Auto trace</button><br>
    <button class="mode" data-mode="anchor">Add anchors (A)</button>
    <button id="undoAnchor">Undo anchor (Z)</button>
    <button id="clearAnchors">Clear anchors</button>
    <button id="retraceAll">Re-trace all with anchors</button><br>
    <button class="mode" data-mode="exclude">Not this curve (X)</button>
    <button id="clearExcl">Undo exclusions</button><br>
    <button class="mode" data-mode="wrap">Mark backup-scale interval (W, 2 clicks)</button>
    <button id="clearWrap">Clear intervals</button>
    <div class="row">re-trace window ±<input id="winFt" size="4" value="150"> ft
      <label><input type="checkbox" id="snap" checked> snap</label></div>
    <div id="anchorList" class="info"></div>
  </section>
  <section><h2>6. QC &amp; save</h2>
    <div id="qcInfo" class="info"></div>
    <button id="qcPlot">QC plot</button>
    <button id="exportLas">Export LAS</button>
    <button id="saveTrain">Save as training data</button>
    <button id="saveSession">Save session</button>
    <div id="saveInfo" class="info"></div>
  </section>
  <div id="status">mode: pan</div>
</aside>
<main><div id="viewer"></div><canvas id="ov"></canvas>
  <div id="qcPane" hidden><button id="qcClose">close</button><img id="qcImg"></div></main>
<script src="/static/editor.js"></script>
</body></html>
