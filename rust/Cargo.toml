[package]
license = "AGPL-3.0-or-later"
publish = false
name = "curve_tracing_rs"
version = "0.2.0"
edition = "2021"
description = "Semi-automatic and ML-assisted digitization of raster scans of petrophysical well logs"
authors = ["Larry Syu-Heng Lai"]

[lib]
name = "curve_tracing_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rayon = "1"
