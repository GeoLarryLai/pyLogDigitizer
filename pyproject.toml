[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pylogdigitizer"
version = "0.2.0"
description = "Semi-automatic and ML-assisted digitization of raster scans of petrophysical well logs"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Larry Syu-Heng Lai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Development Status :: 3 - Alpha",
]
dependencies = ["numpy", "pillow", "lasio", "pandas", "pyyaml", "opencv-python",
                "rapidocr>=3,<4", "onnxruntime",   # default OCR engine (header + depth labels); PP-OCRv4 models bundled
                "fastapi", "uvicorn", "httpx", "matplotlib", "pypdf>=4,<7"]   # Rust tracer built by maturin; torch optional (training / legacy ML cost map only); matplotlib imported lazily (QC plot)

[project.urls]
Homepage = "https://github.com/GeoLarryLai/pyLogDigitizer"
Repository = "https://github.com/GeoLarryLai/pyLogDigitizer"
Issues = "https://github.com/GeoLarryLai/pyLogDigitizer/issues"

[project.scripts]
pylogdigitizer = "pylogdigitizer.cli:main"
pylogdigitizer-app = "pylogdigitizer.app:main"

[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "pylogdigitizer.curve_tracing_rs"
features = ["pyo3/extension-module"]
# never package stray locally built extension modules (the Rust one is built by maturin per platform)
exclude = ["src/pylogdigitizer/*.so", "src/pylogdigitizer/*.pyd", "src/pylogdigitizer/**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
