# Per-well run settings for the shipped Kansas KGS black-and-white examples (used by
# scripts/run_regression.py, notebook 01 and the app catalog). Only facts read off the log header
# go here (track, scale ends, backup scale); layout, extents, panel width and depth labels are
# detected automatically.
#   scale_source: header = read from the scan header; assumed = vendor/era convention, not verified
#   first_depth: optional fallback when OCR is unavailable (value of the first depth label).
# Other public KGS wells are fetched on demand: pylogdigitizer.kgs_examples.fetch_kgs_example.
profile: kansas_kgs
data_dir: example_data
defaults: {scale_type: linear, use_hatch: false, wrap_side: right}
wells:
  - name: USA_A_16
    dir: USA_A_16_15-055-20536
    las: USA_A_16_4342_crop_3200-4800.las
    runs:
      - {scan: 4342_crop_3260-4770.tif, curve: GR, track: track1, scale: [0, 150], backup: [150, 300], wrap_side: right, use_hatch: true, scale_source: header, first_depth: 3300, note: "crop of 4342.tif: header band + about 3260-4770 ft"}
  - name: MOBIL_12-1
    dir: MOBIL_12-1_15-189-20087
    las: MOBIL_12-1_227233_3950-5710.las
    runs:
      - {scan: 227233.tif, curve: DT, track: track2, scale: [100, 40], backup: [160, 100], wrap_side: left, scale_source: header, first_depth: 4000}
  - name: Chitwood_12
    dir: Chitwood_12_15-151-10469
    las: Chitwood_12_260245_300-2650.las
    runs:
      - {scan: 260245.tif, curve: GR, track: track1, scale: [0, 160], backup: [160, 320], wrap_side: right, scale_source: header, note: "print: GAMMA RAY API 0-160, backup 160-320 (hatched)"}
